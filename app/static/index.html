<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人群圈选 Agent</title>
<style>
  /* ===== 全局：浅色主题，业务工具风格 ===== */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Microsoft YaHei", sans-serif; background: #eef1f5; color: #22303d; }
  .layout { display: flex; max-width: 1180px; margin: 0 auto; gap: 16px; padding: 16px; }
  .main { flex: 1; min-width: 0; }
  .side { width: 280px; flex-shrink: 0; }

  /* ===== 顶部状态栏 ===== */
  header { background: #1f6feb; color: #fff; padding: 14px 20px; display: flex;
           align-items: center; justify-content: space-between; }
  header h1 { font-size: 17px; font-weight: 600; }
  .status { font-size: 12px; display: flex; gap: 8px; align-items: center; }
  .badge { background: rgba(255,255,255,.2); padding: 3px 10px; border-radius: 20px; }
  .badge.real { background: #ff9f43; color: #5a3200; font-weight: 600; }
  .badge.mock { background: rgba(255,255,255,.25); }

  /* ===== 输入区 ===== */
  .inputbar { display: flex; gap: 8px; margin-bottom: 14px; }
  .inputbar input { flex: 1; padding: 12px 14px; border: 1px solid #cfd8e3;
                    border-radius: 8px; font-size: 14px; outline: none; }
  .inputbar input:focus { border-color: #1f6feb; }
  .inputbar button { background: #1f6feb; color: #fff; border: none; padding: 0 26px;
                     border-radius: 8px; font-size: 14px; cursor: pointer; }
  .inputbar button:disabled { background: #9db8d9; cursor: wait; }
  .hint { font-size: 12px; color: #7b8b9c; margin-bottom: 14px; }
  .hint span { background: #fff; border: 1px solid #dde5ee; border-radius: 14px;
               padding: 4px 12px; margin-right: 6px; cursor: pointer; display: inline-block; }
  .hint span:hover { border-color: #1f6feb; color: #1f6feb; }

  /* ===== 卡片通用 ===== */
  .card { background: #fff; border: 1px solid #e2e8ef; border-radius: 10px;
          padding: 18px; margin-bottom: 14px; }
  .fallback { border-left: 4px solid #f0a020; color: #7a5a20; }

  /* ===== 结果指标 ===== */
  .metrics { display: flex; gap: 10px; margin: 10px 0 16px; }
  .metrics div { flex: 1; background: #f7f9fc; border: 1px solid #e2e8ef;
                 border-radius: 8px; padding: 10px 12px; text-align: center; }
  .metrics .k { font-size: 11px; color: #7b8b9c; }
  .metrics .v { font-size: 20px; font-weight: 700; color: #1f6feb; margin-top: 2px; }
  .metrics .v.red { color: #c0392b; }

  /* ===== SQL 折叠 ===== */
  details summary { cursor: pointer; font-size: 12.5px; color: #5a7ba6; }
  pre.sql { background: #f6f8fa; border: 1px solid #e2e8ef; border-left: 3px solid #8fa6bd;
            padding: 10px; font-size: 12px; overflow-x: auto; margin-top: 8px;
            font-family: Consolas, monospace; white-space: pre-wrap; }

  /* ===== 画像条形图 ===== */
  .prof-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 10px; }
  .prof h4 { font-size: 12.5px; color: #5a6b7d; margin-bottom: 6px; }
  .bar-row { display: flex; align-items: center; font-size: 11.5px; margin-bottom: 4px; }
  .bar-row .lb { width: 72px; color: #5a6b7d; text-align: right; padding-right: 8px;
                 white-space: nowrap; }
  .bar-row .bar { flex: 1; height: 14px; background: #eef2f7; border-radius: 7px; overflow: hidden; }
  .bar-row .bar i { display: block; height: 100%; background: #1f6feb; border-radius: 7px; }
  .bar-row .pc { width: 84px; padding-left: 8px; color: #5a6b7d; }

  /* ===== 名单表 ===== */
  table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 10px; }
  th { background: #f2f6fb; color: #5a6b7d; font-weight: 600; padding: 7px 8px;
       text-align: left; border-bottom: 1px solid #e2e8ef; }
  td { padding: 6px 8px; border-bottom: 1px solid #f0f3f7; color: #3a4a5a; }

  .btn-export { display: inline-block; background: #fff; color: #1f6feb;
                border: 1px solid #1f6feb; border-radius: 7px; padding: 7px 18px;
                font-size: 13px; cursor: pointer; margin-top: 4px; }
  .btn-export:hover { background: #eef4ff; }
  .err { color: #c0392b; font-size: 13px; margin-top: 8px; }

  /* ===== 侧栏历史 ===== */
  .side h3 { font-size: 14px; margin-bottom: 10px; color: #3a4a5a; }
  .h-item { background: #fff; border: 1px solid #e2e8ef; border-radius: 8px;
            padding: 10px 12px; margin-bottom: 8px; cursor: pointer; }
  .h-item:hover { border-color: #1f6feb; }
  .h-item .q { font-size: 12.5px; color: #22303d; overflow: hidden; text-overflow: ellipsis;
               white-space: nowrap; }
  .h-item .m { font-size: 11px; color: #8a99a8; margin-top: 4px; }
  .empty { color: #9aa9b8; font-size: 12.5px; text-align: center; padding: 20px 0; }
  .loading { color: #1f6feb; font-size: 13px; padding: 16px 0; }
</style>
</head>
<body>
<header>
  <h1>人群圈选 Agent</h1>
  <div class="status" id="status">加载中…</div>
</header>

<div class="layout">
  <div class="main">
    <!-- 输入区：自然语言圈选需求 -->
    <div class="inputbar">
      <input id="q" placeholder="用一句自然语言描述要圈的人群…" autofocus>
      <button id="go" onclick="run()">圈 选</button>
    </div>
    <div class="hint">试试：
      <span onclick="fill(this)">圈出近30天加购但未下单的高价值用户</span>
      <span onclick="fill(this)">圈出流失预警的美妆用户</span>
      <span onclick="fill(this)">圈出超过60天没活跃的沉默用户</span>
      <span onclick="fill(this)">你是谁</span>
    </div>
    <div id="result">
      <!-- 首屏欢迎占位：说明产品能力与链路，替代空白 -->
      <div class="card" style="color:#5a6b7d;">
        <h4 style="font-size:14px;margin-bottom:8px;">自然语言圈选人群</h4>
        <p style="font-size:12.5px;line-height:1.9;color:#7b8b9c;">
          输入一句业务需求（如「圈出近30天加购但未下单的高价值用户」），Agent 会自动完成：
          意图路由 → DeepSeek 生成圈选 SQL → SQLite 执行（失败自动带报错自愈重试，上限 2 次）
          → 返回命中人数、生成 SQL（透明可核对）、人群画像与名单，可一键导出 CSV。
          每次圈选自动存入右侧历史，随时回看。</p>
      </div>
    </div>
  </div>

  <!-- 侧栏：圈选历史 -->
  <div class="side">
    <h3>圈选历史</h3>
    <div id="history"><div class="empty">暂无记录</div></div>
  </div>
</div>

<script>
/* ================= 状态栏 ================= */
async function loadStatus() {
  const s = await (await fetch('/api/status')).json();
  const modeTag = s.mode === 'real'
    ? `<span class="badge real">真实模式 · ${s.model}</span>`
    : `<span class="badge mock">演示模式（未配 API Key）</span>`;
  document.getElementById('status').innerHTML =
    `${modeTag}<span class="badge">库内 ${s.users} 用户</span>`;
}

/* ================= 历史侧栏 ================= */
async function loadHistory() {
  const list = await (await fetch('/api/history')).json();
  const box = document.getElementById('history');
  if (!list.length) { box.innerHTML = '<div class="empty">暂无记录</div>'; return; }
  box.innerHTML = list.map(r => `
    <div class="h-item" onclick="replay(${r.id})">
      <div class="q">${esc(r.question)}</div>
      <div class="m">${r.created_at} · ${r.intent === 'select' ? (r.count ?? 0) + ' 人' : '兜底'} · ${r.elapsed_ms ?? 0}ms</div>
    </div>`).join('');
}

/* 回看历史：取详情按同一结果卡渲染 */
async function replay(id) {
  document.getElementById('result').innerHTML = '<div class="card loading">加载记录…</div>';
  const rec = await (await fetch('/api/history/' + id)).json();
  if (rec.intent !== 'select') {
    render(`<div class="card fallback">${esc(rec.question)}<br><br>${esc(rec.sql || '兜底请求')}</div>`);
    return;
  }
  renderResult({ sql: rec.sql, count: rec.count, sample: null, profile: rec.profile,
                 retries: rec.retries, elapsed_ms: rec.elapsed_ms, exec_ok: true,
                 record_id: rec.id, replayed: true });
}

/* ================= 核心交互：圈选 ================= */
async function run() {
  const q = document.getElementById('q').value.trim();
  if (!q) return;
  const btn = document.getElementById('go');
  btn.disabled = true;
  document.getElementById('result').innerHTML = '<div class="card loading">Agent 正在运行：路由 → DeepSeek 生成 SQL → 执行 → 自愈检查…</div>';
  try {
    const resp = await fetch('/api/select', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: q })
    });
    if (!resp.ok) { const e = await resp.json(); throw new Error(e.detail || resp.status); }
    renderResult(await resp.json());
    loadHistory();          // 刷新侧栏
  } catch (e) {
    render(`<div class="card"><div class="err">请求失败：${esc(String(e.message || e))}</div></div>`);
  } finally {
    btn.disabled = false;
  }
}

/* ================= 结果渲染 ================= */
function renderResult(r) {
  /* 非圈选（兜底闲聊）：展示话术 */
  if (r.reply !== undefined) {
    render(`<div class="card fallback">${esc(r.reply)}</div>`);
    return;
  }
  /* 执行失败：展示错误与重试次数 */
  if (!r.exec_ok) {
    render(`<div class="card">
      <div class="err">SQL 执行失败（已自愈重试 ${r.retries} 次仍未成功）</div>
      <pre class="sql">${esc(r.sql || '')}</pre>
      <div class="err">${esc(r.error || '')}</div></div>`);
    return;
  }
  /* 圈选成功：指标 + SQL + 画像 + 名单 */
  const prof = Object.entries(r.profile || {}).map(([dim, rows]) =>
    `<div class="prof"><h4>${{gender:'性别',city_tier:'城市等级',member_level:'会员等级',category_pref:'品类偏好'}[dim] || dim}</h4>` +
    rows.slice(0, 5).map(x => `
      <div class="bar-row"><div class="lb">${esc(x.label)}</div>
        <div class="bar"><i style="width:${x.pct}%"></i></div>
        <div class="pc">${x.pct}%（${x.count}）</div></div>`).join('') + '</div>'
  ).join('');

  const table = r.sample ? `
    <table><tr><th>用户ID</th><th>性别</th><th>年龄</th><th>城市</th><th>会员</th><th>品类偏好</th></tr>
    ${r.sample.map(u => `<tr><td>${u.user_id}</td><td>${esc(u.gender)}</td><td>${u.age}</td>
      <td>${esc(u.city_tier)}</td><td>${esc(u.member_level)}</td><td>${esc(u.category_pref)}</td></tr>`).join('')}
    </table>` : '';

  render(`<div class="card">
    <div class="metrics">
      <div><div class="k">命中人数</div><div class="v red">${r.count}</div></div>
      <div><div class="k">自愈重试</div><div class="v">${r.retries} 次</div></div>
      <div><div class="k">耗时</div><div class="v">${(r.elapsed_ms / 1000).toFixed(1)}s</div></div>
    </div>
    <details><summary>查看生成的 SQL（透明可核对）</summary>
      <pre class="sql">${esc(r.sql || '')}</pre></details>
    <h4 style="margin:14px 0 2px;font-size:13.5px;">人群画像</h4>
    <div class="prof-grid">${prof}</div>
    <h4 style="margin:16px 0 0;font-size:13.5px;">名单预览${r.sample ? '（前 ' + r.sample.length + ' 条）' : ''}</h4>
    ${table || '<div class="empty">（历史记录不重复拉取名单明细，可点击导出获取完整名单）</div>'}
    <button class="btn-export" onclick="location.href='/api/export/${r.record_id}'">导出完整名单 CSV</button>
  </div>`);
}

function render(html) { document.getElementById('result').innerHTML = html; }
function esc(s) { return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fill(el) { document.getElementById('q').value = el.textContent; run(); }

document.getElementById('q').addEventListener('keydown', e => { if (e.key === 'Enter') run(); });
loadStatus(); loadHistory();
</script>
</body>
</html>
